<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Contact Us | NNN IT Solution Store</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .buy-section {
      background-color: #fff;
      padding: 20px;
      margin: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 0 auto;
    }

    .buy-section h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .container {
      padding: 20px;
    }

    .input, .input-email, .input-address, .input-product, .input-quantity {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .input:focus, .input-email:focus, .input-address:focus, .input-product:focus, .input-quantity:focus {
      border-color: #333;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      color: white;
      background-color: #333;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header class="header">
    <h1 class="header-title">NNN IT Solution Store</h1>
    <img src="pics/ap.jpg" alt="NNN IT Logo" class="header-image">
  </header>
  <!-- Navigation Bar -->
<nav class="nav">
    <a href="home.html" class="nav-link">Home</a>
    <a href="computer_parts.html" class="nav-link">Computer Parts</a>
    <a href="printer.html" class="nav-link">Printers</a>
    <a href="acer.html" class="nav-link">Acer Laptops</a>
    <a href="lenovo.html" class="nav-link">Lenovo Laptops</a>
    <a href="samsung.html" class="nav-link">Samsung Laptops</a>
    <a href="desktop.html" class="nav-link">Desktop</a>
    <a href="accessories.html" class="nav-link">Accessories</a>
    <a href="about.html" class="nav-link">About Us</a>
     <a href="contact.html" class="nav-link">Contact Us</a>
  </nav>

  <!-- Buy Section -->
  <section class="buy-section">
    <h2>Buy Product</h2>
    <form action="#" method="post">
      <div class="container">
        <input type="text" class="input" name="name" placeholder="Your Name" required>
        <input type="email" class="input-email" name="email" placeholder="Your Email" required>
        <input type="text" class="input-address" name="address" placeholder="Your Address" required>
        <input type="text" class="input-product" name="product" placeholder="Product Name" required>
        <input type="number" class="input-quantity" name="quantity" placeholder="Quantity" required>
        <button type="submit" class="btn">Buy Now</button>
      </div>
    </form>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Limkokwing University of Creative and Technology</p>
  </footer>

</body>
</html>
