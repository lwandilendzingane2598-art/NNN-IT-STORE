<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Contact Us | NNN IT Solution Store</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .thank-you-card {
      background: linear-gradient(135deg, #e3f2fd, #90caf9);
      padding: 50px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .thank-you-card h2 {
      font-size: 36px;
      margin-bottom: 20px;
      color: #0d47a1;
    }

    .thank-you-card p {
      font-size: 20px;
      margin-bottom: 30px;
      color: #1976d2;
    }

    .thank-you-card a {
      display: inline-block;
      padding: 15px 30px;
      font-size: 18px;
      color: white;
      background-color: #0d47a1;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .thank-you-card a:hover {
      background-color: #1976d2;
    }

  </style>
</head>
<body background="pics/bg8.jpg">

  <!-- Header Section -->
  <header class="header">
    <h1 class="header-title">NNN IT Solution Store</h1>
    <img src="pics/ap.jpg" alt="NNN IT Logo" class="header-image">
  </header>


  <!-- Thank You Card Section -->
  <section class="thank-you-card">
    <h2>Thank You!</h2>
    <p>Thank you for your message. We will get back to you soon.</p>
    <a href="contact.html">Back to Contact Us</a>
  </section>

</body>
</html>
